  backend: { type: github-actions, githubActions: { providerRef: github-public, repo: compliance-framework/factory, workflow: run-agent.yml } }
  image: ghcr.io/compliance-framework/factory-agent:0.1.0
  scaling: { min: 0, max: 10 }
