# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.7.2/configuration-schema.json
# oapi-codegen config for the dispatcher's HTTP client (go generate ./... runs it). Webhooks and
# the ops routes aren't on the public /api/v1 base, so the client leaves them out.
package: apiclient
output: client.gen.go
generate:
  models: true
  client: true
output-options:
  exclude-tags:
    - webhooks
    - ops
  # An absent list or map is nil already; no *[]T or *map[K]V.
  prefer-skip-optional-pointer-on-container-types: true
compatibility:
  # Enum constants are always <Type><Value>, so adding a value never renames another.
  always-prefix-enum-values: true
