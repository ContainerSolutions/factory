kind: TaskSpec
metadata: { name: release-docs }
spec:
  instructions: { template: prompts/release-docs.md.tmpl }
  harness: { default: { name: codex, config: { model: "gpt-5*", reasoningEffort: high } } }
  workspace: { repos: [{ ref: "=task.target.repo + '@main'", mode: rw }] }
  identity: author
  effects: { allow: [push-branch, pr.open] }
  output: { schema: schemas/release-docs.json, outcomes: [pr-opened] }
