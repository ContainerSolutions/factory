openapi: 3.0.3
info:
  title: CCF Factory API
  version: 0.1.0
  description: |
    The HTTP contract of the CCF Factory dispatcher (`factory serve`). It is the only coupling
    between the dispatcher, the agents (`factory-agent`), the web UI and the CLI; see
    `design/workstreams/foundation/LLD/contracts.md` §HTTP API.

    - Base path `/api/v1`. All bodies are JSON unless an operation says otherwise; times are RFC 3339.
    - Errors are `application/problem+json` (RFC 9457) with a machine-readable `code`.
    - Lists paginate with `?cursor=` (pass the previous page's `nextCursor`) and filter with
      `?labelSelector=`.
    - Components marked `x-go-type` are the `internal/apis/v1alpha1` Go types, in full. They are
      generated from the Go types (`api/componentsgen`, between the GENERATED markers at the end
      of this file), and every example is strictly decoded into them by `api/spec_test.go`.
    - `getTranscript` and `uploadTranscript` carry `application/gzip` (gzip-compressed JSON Lines);
      `getEnvironmentLog` and `uploadEnvironmentLog` carry `text/plain`.
    - Webhooks (`/hooks/{provider}`) are served outside `/api/v1` and are handled by the provider
      adapter (`Conn.Handler()`), not by the generated server.
    - The ops routes (`/healthz`, `/readyz`, `/metrics`, tag `ops`) are served only on the
      localhost ops listener (`--ops-addr`, default `127.0.0.1:9090`), never on the public address.
      They are documented here and excluded from code generation.
    - Additive changes only during the PoC; a breaking change moves to `/api/v2`.
  contact:
    name: compliance-framework maintainers
    url: https://github.com/ContainerSolutions/factory
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
    description: The dispatcher's public listener (`--addr`).
tags:
  - name: agents
    description: Agent registration, status and deregistration.
  - name: enrollments
    description: One-time enrollments an admin mints for an agent host, which registers with them (P1 §6).
  - name: leases
    description: Long-poll leases, heartbeats, completion and abandonment.
  - name: tasks
    description: Task data (task, prompt, context, run transcript), for the agent holding the lease and, where noted, the UI.
  - name: effects
    description: The Effector API, the only way agents write to providers.
  - name: resources
    description: Read models for the web UI.
  - name: dry-run
    description: Catalog evaluation without side effects.
  - name: commands
    description: Operator commands (pause, resume, cancel, redispatch, dispatch, resync-catalog), event replay, and closing or deleting a work item.
  - name: events
    description: Server-sent events for live UI updates.
  - name: auth
    description: GitHub OAuth for the web UI, and the OAuth client's device-flow configuration.
  - name: webhooks
    description: Provider webhooks, verified and handled by the provider adapter. Not generated.
  - name: ops
    description: Health and metrics, only on the localhost ops listener. Not generated.

paths:
  # ---- agents ------------------------------------------------------------------------------
  /agents:
    post:
      operationId: registerAgent
      tags: [agents]
      summary: Register an agent
      description: |
        Registers (or re-registers) an agent in a pool, with exactly one of two credentials
        (P1 §6; two are a `401`):

        - **An enrollment token** (`createEnrollment`), once: an admin minted it for a pool, an
          owner and a name. The response adds the agent's long-lived `refreshToken`, and the
          enrollment token is spent.
        - **The agent's refresh token**, on every restart or after a `401`: the response carries
          a fresh agent token and a new refresh token, which replaces the one presented.

        The pool, owner and name come from the enrollment: the request's `pool` and `host` must
        match them, or the response is `400`. The capabilities must meet `Pool.spec.require`,
        and the agent is named `agt_<owner>-<host>`; registering again replaces it. The
        `X-Factory-Join-Token` and `X-Factory-Owner-Token` headers of the removed device flow
        are refused (`401`).
      security:
        - enrollmentToken: []
        - agentRefreshToken: []
      requestBody:
        description: The agent's pool, host and capabilities.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '201':
          description: Registered. The agent token, and the refresh token when there is one, are returned only here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegistration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listAgents
      tags: [resources]
      summary: List agents
      description: Registered agents with their capabilities, lending and status.
      security:
        - uiSession: []
        - cliToken: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LabelSelectorParam'
      responses:
        '200':
          description: A page of agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent's status or lending
      description: |
        The agent reports its phase (`Ready`, `Throttled` with `until`, `Draining`, `Offline`)
        and re-sends its lending after a local config reload. Only the agent itself may call it.
      security:
        - agentToken: []
      requestBody:
        description: The new phase and/or lending.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          description: The updated agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deregisterAgent
      tags: [agents]
      summary: Deregister an agent
      description: |
        Revokes the agent token and marks the agent `Offline`. Running leases are abandoned. The
        agent itself, an admin UI session (the `maintainers` Group) or the CLI token may call it.
        An admin's delete also revokes the agent's refresh token; the agent's own doesn't, so it
        can register again with it.
      security:
        - agentToken: []
        - uiSession: []
        - cliToken: []
      responses:
        '204':
          description: Deregistered.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'

  # ---- enrollments -------------------------------------------------------------------------
  /enrollments:
    post:
      operationId: createEnrollment
      tags: [enrollments]
      summary: Mint an enrollment
      description: |
        Mints a one-time enrollment for an agent host: the pool it joins, the owner who lends it
        and its name (the agent is `agt_<owner>-<name>`). The admin vouches for the owner; no
        GitHub login happens on the agent side. The response holds the enrollment token, shown
        only here and stored hashed. The host's supervisor registers once with it
        (`registerAgent` with `X-Factory-Enrollment-Token`) before `expiresAt`. A UI session
        must belong to the `maintainers` Group; the CLI token is a full admin (`factory agent
        enroll`).
      security:
        - uiSession: []
        - cliToken: []
      requestBody:
        description: The enrollment's pool, owner, name and lifetime.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: Minted. The enrollment token is returned only here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listEnrollments
      tags: [enrollments]
      summary: List enrollments
      description: |
        The enrollments, used and unused, without their tokens. Admins only, as for
        `createEnrollment`.
      security:
        - uiSession: []
        - cliToken: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of enrollments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /enrollments/{id}:
    parameters:
      - $ref: '#/components/parameters/EnrollmentID'
    delete:
      operationId: deleteEnrollment
      tags: [enrollments]
      summary: Revoke an enrollment
      description: |
        Revokes an unused enrollment: its token can no longer register an agent. A used
        enrollment's token is already spent, so deleting it only removes the record; the agent
        it registered stays (revoke that with `deregisterAgent`). Admins only, as for
        `createEnrollment`.
      security:
        - uiSession: []
        - cliToken: []
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'

  # ---- leases ------------------------------------------------------------------------------
  /agents/{id}/lease:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    get:
      operationId: leaseTask
      tags: [leases]
      summary: Long-poll for a task
      description: |
        Parks the request for up to `wait` while the scheduler looks for a task this agent may
        take. Returns the lease, the task (with its resolved harness) and the lease's credential
        bundle: a scoped git credential for the task repo, a read-only one per private read repo
        (public read repos are cloned anonymously) and the run token (`runToken`); the
        credentials appear only in this response and are never stored (the run token only as
        its hash).
        `204` when nothing matched in time.
      security:
        - agentToken: []
      parameters:
        - name: wait
          in: query
          description: How long to wait for a task, in seconds (`30s`). At most `60s`.
          schema:
            type: string
            pattern: '^[0-9]{1,2}s$'
            default: 30s
            example: 30s
      responses:
        '200':
          description: A task was leased.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '204':
          description: No task within `wait`; poll again.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /leases/{id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/LeaseID'
    post:
      operationId: heartbeatLease
      tags: [leases]
      summary: Extend a lease and report progress
      description: |
        Sent every `pool.lease.heartbeat`. Carries the progress events since the last heartbeat
        (appended to the Run and broadcast on SSE) and token usage **deltas**. The response says
        whether to cancel the run and may carry refreshed git credentials (the task repo's and
        the read-only ones, all refreshed together). `404` or `409` means the lease is gone: the
        agent must stop the run.
      security:
        - agentToken: []
      requestBody:
        description: Progress and usage since the last heartbeat.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: The lease was extended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /leases/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/LeaseID'
    post:
      operationId: completeLease
      tags: [leases]
      summary: Complete a lease with a Result
      description: |
        Ends the run with its Result (validated against the TaskSpec's output schema; an invalid
        Result fails the task with `invalid-result`) and the transcript reference returned by
        `PUT /runs/{id}/transcript`.
      security:
        - agentToken: []
      requestBody:
        description: The Result and transcript reference.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
      responses:
        '204':
          description: Completed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /leases/{id}/abandon:
    parameters:
      - $ref: '#/components/parameters/LeaseID'
    post:
      operationId: abandonLease
      tags: [leases]
      summary: Hand a leased task back
      description: |
        Returns the task to `Pending`. `throttled` (with `until`) doesn't consume an attempt and
        marks the agent `Throttled`; `agent-error` and `shutdown` follow the queue's retry policy.
      security:
        - agentToken: []
      requestBody:
        description: Why the task is handed back.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbandonRequest'
      responses:
        '204':
          description: Abandoned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'

  # ---- tasks -------------------------------------------------------------------------------
  /tasks:
    get:
      operationId: listTasks
      tags: [resources]
      summary: List tasks
      description: Tasks, newest first.
      security:
        - uiSession: []
        - cliToken: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LabelSelectorParam'
      responses:
        '200':
          description: A page of tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskID'
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      description: The full Task. An agent may read only a task it holds the active lease of.
      security:
        - agentToken: []
        - uiSession: []
        - cliToken: []
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /tasks/{id}/prompt:
    parameters:
      - $ref: '#/components/parameters/TaskID'
    get:
      operationId: getTaskPrompt
      tags: [tasks]
      summary: Get a task's rendered prompt
      description: |
        The prompt rendered from the TaskSpec's instructions template with the task's inputs.
        It refers to context items by index; it never inlines untrusted bodies. A run token
        works only for its own task.
      security:
        - agentToken: []
        - runToken: []
      responses:
        '200':
          description: The rendered prompt.
          headers:
            Digest:
              description: The prompt's digest, as in `spec.prompt.digest` (`sha256:<hex>`).
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /tasks/{id}/output-schema:
    parameters:
      - $ref: '#/components/parameters/TaskID'
    get:
      operationId: getTaskOutputSchema
      tags: [tasks]
      summary: Get a task's output schema
      description: |
        The JSON Schema (draft 2020-12) of the task's Result: its TaskSpec's `output.schema`,
        from the live catalog snapshot, which is the one `completeLease` validates the Result
        against. The agent checks its Result with it before completing, so it can repair it.
        A schema that refers to other catalog schemas is served as one compound document
        (they are embedded under `$defs`, by `$id`); references to the v1alpha1 schemas (the
        base Result) stay references by their `$id`. `404` when the TaskSpec declares no
        output schema (or is no longer in the catalog). An agent may read only a task it holds
        the active lease of. A run token works only for its own task.
      security:
        - agentToken: []
        - runToken: []
        - uiSession: []
        - cliToken: []
      responses:
        '200':
          description: The output schema.
          content:
            application/schema+json:
              schema:
                $ref: '#/components/schemas/JSONSchemaDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /tasks/{id}/context/{n}:
    parameters:
      - $ref: '#/components/parameters/TaskID'
      - name: n
        in: path
        required: true
        description: The 0-based index into `spec.context`.
        schema:
          type: integer
          minimum: 0
    get:
      operationId: getTaskContext
      tags: [tasks]
      summary: Get one fetched context item
      description: |
        Context item `n` of the task, fetched by the dispatcher and labelled with its trust.
        Untrusted content is returned fenced; the agent wraps it in `<untrusted>` before handing
        it to the harness. A run token works only for its own task.
      security:
        - agentToken: []
        - runToken: []
      responses:
        '200':
          description: The context item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /runs/{id}/transcript:
    parameters:
      - $ref: '#/components/parameters/RunID'
    get:
      operationId: getTranscript
      tags: [tasks]
      summary: Download a run's transcript
      description: |
        The stored transcript exactly as uploaded: the harness transcript as gzip-compressed
        JSON Lines. The UI loads it lazily for the run view; an agent may read the transcript of
        a run of its own active lease. `404` when none was uploaded.
      security:
        - uiSession: []
        - agentToken: []
        - cliToken: []
      responses:
        '200':
          description: The transcript.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: uploadTranscript
      tags: [tasks]
      summary: Upload a run's transcript
      description: |
        The harness transcript as gzip-compressed JSON Lines, at most 20 MB. Uploading again
        replaces it. `getTranscript` serves it back unchanged. A run token works only for its
        own run.
      security:
        - agentToken: []
        - runToken: []
      requestBody:
        description: The gzip-compressed JSON Lines transcript.
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Stored. Pass `transcriptRef` to `complete`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'

  /runs/{id}/environment-log:
    parameters:
      - $ref: '#/components/parameters/RunID'
    get:
      operationId: getEnvironmentLog
      tags: [tasks]
      summary: Download a run's environment log
      description: |
        The workspace's environment log as the agent uploaded it: the TaskSpec environment's
        scripts' stdout and stderr, redacted, as plain text. `404` when none was uploaded.
      security:
        - uiSession: []
        - cliToken: []
      responses:
        '200':
          description: The environment log.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: uploadEnvironmentLog
      tags: [tasks]
      summary: Upload a run's environment log
      description: |
        The workspace's environment log as plain text (redacted and capped by the agent), at
        most 20 MB. Uploading again replaces it. It is kept with the run, under the
        transcripts' caps and retention. A run token works only for its own run.
      security:
        - agentToken: []
        - runToken: []
      requestBody:
        description: The environment log.
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentLogUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'

  # ---- effects -----------------------------------------------------------------------------
  /tasks/{id}/effects:
    parameters:
      - $ref: '#/components/parameters/TaskID'
    post:
      operationId: createEffect
      tags: [effects]
      summary: Apply (or record) an effect
      description: |
        The Effector API. The agent must hold the task's active lease. The op must be in the
        task's `effects.allow`, label ops must match `effects.labels`, and the target must be the
        task's target or its linked objects (`403 effect-not-allowed`). `idempotencyKey` is
        required (`400 idempotency-key-required`): a repeated key returns the stored effect with
        `200`. Rate limits answer `429`. Git-side ops (`push-branch`, `stack.*`) are recorded,
        not applied. A run token works only for its own task.
      security:
        - agentToken: []
        - runToken: []
      requestBody:
        description: The effect to apply or record.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EffectRequest'
      responses:
        '200':
          description: Applied (or replayed for a known idempotency key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'

  # ---- resources ---------------------------------------------------------------------------
  /workitems:
    get:
      operationId: listWorkItems
      tags: [resources]
      summary: List work items
      description: Work items, most recently updated first.
      security:
        - uiSession: []
        - cliToken: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LabelSelectorParam'
      responses:
        '200':
          description: A page of work items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /workitems/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkItemID'
    get:
      operationId: getWorkItem
      tags: [resources]
      summary: Get a work item with its timeline
      description: The work item and the events, tasks, runs and effects of its timeline.
      security:
        - uiSession: []
        - cliToken: []
      responses:
        '200':
          description: The work item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteWorkItem
      tags: [commands]
      summary: Delete a work item and everything keyed to it
      description: |
        Removes the work item and its tasks, prompts, runs (with their transcripts and
        environment logs), effects, events and debounces from the store. While one of its
        tasks is leased (Leased, Running or Cancelling) it answers `409 task-leased`, unless
        `force=true`, which cancels the active tasks first. Admin only.
      security:
        - uiSession: []
        - cliToken: []
      parameters:
        - name: force
          in: query
          required: false
          description: Cancel the active tasks and delete even while one is leased.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: What was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemDeleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /runs/{id}:
    parameters:
      - $ref: '#/components/parameters/RunID'
    get:
      operationId: getRun
      tags: [resources]
      summary: Get a run with its effects
      description: The run (progress, result, usage) and the effects it made.
      security:
        - uiSession: []
        - cliToken: []
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /queues:
    get:
      operationId: listQueues
      tags: [resources]
      summary: List queues with their depth
      description: Each queue with its running tasks and its pending tasks and why they wait.
      security:
        - uiSession: []
        - cliToken: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LabelSelectorParam'
      responses:
        '200':
          description: A page of queues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /pools:
    get:
      operationId: listPools
      tags: [resources]
      summary: List pools with their agents
      description: Each pool with the agents registered in it.
      security:
        - uiSession: []
        - cliToken: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LabelSelectorParam'
      responses:
        '200':
          description: A page of pools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /providers:
    get:
      operationId: listProviders
      tags: [resources]
      summary: List providers with their health
      description: Each configured provider instance and its connection health.
      security:
        - uiSession: []
        - cliToken: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LabelSelectorParam'
      responses:
        '200':
          description: A page of providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /catalog:
    get:
      operationId: getCatalog
      tags: [resources]
      summary: Get the loaded catalog
      description: The loaded catalog's commit, load status and errors, and the objects it holds.
      security:
        - uiSession: []
        - cliToken: []
      responses:
        '200':
          description: The catalog summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /catalog/{kind}/{name}:
    parameters:
      - name: kind
        in: path
        required: true
        description: A config kind.
        schema:
          $ref: '#/components/schemas/CatalogKind'
      - name: name
        in: path
        required: true
        description: The object's `metadata.name`.
        schema:
          type: string
          minLength: 1
    get:
      operationId: getCatalogObject
      tags: [resources]
      summary: Get one catalog object
      description: The object as loaded (templates substituted), in its v1alpha1 shape.
      security:
        - uiSession: []
        - cliToken: []
      responses:
        '200':
          description: The object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /catalog/files:
    get:
      operationId: listCatalogFiles
      tags: [resources]
      summary: List the catalog's prompt and schema files
      description: |
        The loaded catalog's files that are not objects: the prompt templates under `prompts/`
        and the JSON Schemas under `schemas/`, by catalog-relative path, sorted by path.
      security:
        - uiSession: []
        - cliToken: []
      responses:
        '200':
          description: The files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFileList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /catalog/file:
    get:
      operationId: getCatalogFile
      tags: [resources]
      summary: Get one prompt or schema file of the catalog
      description: |
        One file of the loaded catalog snapshot, as the catalog holds it: a prompt template
        under `prompts/` (its source, not rendered) or a JSON Schema under `schemas/` (its raw
        bytes). Nothing else is served: `400` for a path outside those two directories, `404`
        for one the catalog doesn't hold.
      security:
        - uiSession: []
        - cliToken: []
      parameters:
        - name: path
          in: query
          required: true
          description: The file's catalog-relative path, e.g. `prompts/implement.md.tmpl`.
          schema:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^(prompts|schemas)/'
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  # ---- dry-run -----------------------------------------------------------------------------
  /catalog/dry-run:
    post:
      operationId: dryRunCatalog
      tags: [dry-run]
      summary: Evaluate an event against the catalog
      description: |
        Runs the rule engine on the event (against the named work item's current state, or an
        empty one) and returns the Evaluation. Nothing is stored and no action is applied.
      security:
        - uiSession: []
        - cliToken: []
      requestBody:
        description: The event to evaluate.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DryRunRequest'
      responses:
        '200':
          description: The evaluation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  # ---- commands ----------------------------------------------------------------------------
  /commands:
    post:
      operationId: postCommand
      tags: [commands]
      summary: Run an operator command
      description: |
        `pause`/`resume` take `target: {scope, name}`; `cancel` takes `target: {task}`;
        `redispatch` takes `target: {task}` and optional `args: {harness}`; `dispatch` takes
        `args: {event}`; `resync-catalog` takes nothing. A UI session must belong to the
        `maintainers` Group; the CLI token is a full admin. The command becomes a
        `factory.command.*` event or an injected event.
      security:
        - uiSession: []
        - cliToken: []
      requestBody:
        description: The command.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'

  /events/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/EventID'
    post:
      operationId: replayEvent
      tags: [commands]
      summary: Replay a stored event through the rules
      description: |
        Evaluates the stored event again, with its own id, against the live catalog and its
        work item as it is now, and applies the decisions. A rule that already acted on the
        event dedupes on its idempotency key, so only the rules that act now and didn't then
        change anything. The decisions that differ from the event's earlier ones are recorded
        on the work item with `replay: true` and returned. A rule that already fired for the
        event is never applied again, whatever changed since (its rails, its actions). When the
        event was applied to its work item but none of its earlier decisions remain there (aged
        out of the bounded history), the replay can't tell what already acted and answers
        `409 replay-history-gone`. A UI session must belong to the `maintainers` Group; the CLI
        token is a full admin.
      security:
        - uiSession: []
        - cliToken: []
      responses:
        '200':
          description: The replay's new decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /workitems/{id}/close:
    parameters:
      - $ref: '#/components/parameters/WorkItemID'
    post:
      operationId: closeWorkItem
      tags: [commands]
      summary: Close a work item
      description: |
        Sets `status.closed`, cancels the work item's active tasks (as the cancel command does)
        and records a decision. The rules then evaluate nothing for the item: its events are
        still stored, and their decisions say it is closed. Closing a closed item updates its
        reason and note. Admin only.
      security:
        - uiSession: []
        - cliToken: []
      requestBody:
        description: Why it is closed.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseWorkItemRequest'
      responses:
        '200':
          description: The closed work item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'

  # ---- events ------------------------------------------------------------------------------
  /stream:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Subscribe to live updates
      description: |
        Server-sent events. Event names and their JSON `data`: `progress` (StreamProgress),
        `workitem.updated` (WorkItem), `task.updated` (Task), `agent.updated` (Agent). Each
        event's `id:` is the store version; reconnect with `Last-Event-ID` to resume (run
        progress is backfilled from the run's ring buffer). A keep-alive comment is sent every
        15 s.
      security:
        - uiSession: []
        - cliToken: []
      parameters:
        - name: topics
          in: query
          required: true
          description: 'Comma-separated topics: `runs/<id>`, `workitems`, `workitems/<id>`, `tasks`, `agents`.'
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              type: string
              pattern: '^(runs/[^/,]+|workitems(/[^/,]+)?|tasks|agents)$'
        - name: Last-Event-ID
          in: header
          required: false
          description: The `id` of the last event received, to resume after a reconnect.
          schema:
            type: string
      responses:
        '200':
          description: The event stream. It stays open until the client disconnects.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  `event: <name>` / `id: <version>` / `data: <JSON>` frames. The data shapes are
                  the `x-sse-events` components below.
              x-sse-events:
                progress:
                  $ref: '#/components/schemas/StreamProgress'
                workitem.updated:
                  $ref: '#/components/schemas/WorkItem'
                task.updated:
                  $ref: '#/components/schemas/Task'
                agent.updated:
                  $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'

  # ---- auth --------------------------------------------------------------------------------
  /auth/login:
    get:
      operationId: login
      tags: [auth]
      summary: Start the GitHub OAuth login
      description: Redirects to GitHub's authorize page with a `state` bound to a short-lived cookie.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: A same-origin path to return to after login.
          schema:
            type: string
            pattern: '^/'
      responses:
        '302':
          description: Redirect to GitHub.
          headers:
            Location:
              description: GitHub's authorize URL.
              schema:
                type: string
                format: uri
        default:
          $ref: '#/components/responses/Error'
  /auth/callback:
    get:
      operationId: authCallback
      tags: [auth]
      summary: Finish the GitHub OAuth login
      description: Checks `state`, exchanges `code`, sets the session cookie and redirects to the UI.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: The authorization code from GitHub.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: The state given at login.
          schema:
            type: string
      responses:
        '302':
          description: Signed in; redirect to `returnTo` (or `/`).
          headers:
            Location:
              description: Where the UI continues.
              schema:
                type: string
            Set-Cookie:
              description: The session cookie (`HttpOnly`, `Secure`, `SameSite=Lax`, 12 h).
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      description: Clears the session. Succeeds without a session too.
      security: []
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Who am I
      description: The signed-in user. `401` when there is no session (the UI redirects to login).
      security:
        - uiSession: []
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /auth/device-config:
    get:
      operationId: getDeviceConfig
      tags: [auth]
      summary: The OAuth client's device-flow configuration
      description: |
        The dispatcher's OAuth client ID and scopes for a GitHub device-flow login. Agents no
        longer use it (they are enrolled, P1 §6); it stays for the UI's sign-in.
      security: []
      responses:
        '200':
          description: The device-flow configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConfig'
        default:
          $ref: '#/components/responses/Error'

  # ---- webhooks (not under /api/v1; handled by Conn.Handler) -------------------------------
  /hooks/{provider}:
    servers:
      - url: /
        description: Served at the root of the public listener, outside `/api/v1`.
    parameters:
      - name: provider
        in: path
        required: true
        description: The provider instance's `metadata.name` (its `spec.github.webhook.path`).
        schema:
          type: string
    post:
      operationId: receiveWebhook
      tags: [webhooks]
      summary: Receive a provider webhook
      description: |
        Delegated to the provider adapter's `Conn.Handler()` (mounted with `echo.WrapHandler`),
        which verifies the signature, persists the delivery and only then acknowledges. The body
        is the provider's own payload and is not described here.
      security:
        - providerSignature: []
      requestBody:
        required: true
        description: The provider's payload, opaque to this contract.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Verified and persisted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'

  # ---- ops (localhost ops listener only) ---------------------------------------------------
  /healthz:
    servers:
      - url: http://127.0.0.1:9090
        description: The localhost ops listener (`--ops-addr`).
    get:
      operationId: getHealthz
      tags: [ops]
      summary: Liveness
      description: The process is up.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    servers:
      - url: http://127.0.0.1:9090
        description: The localhost ops listener (`--ops-addr`).
    get:
      operationId: getReadyz
      tags: [ops]
      summary: Readiness
      description: |
        Whether this instance is ready, the same on every instance, leader or not. `200` once the
        catalog and the store are loaded and the store's first sync has succeeded (a store with
        nothing to sync, in memory or a state dir, has synced once it is loaded). `503` when the
        store has stopped writing (it met an entry newer than it can read: `store-read-only`) or
        its last successful sync is older than its maximum lag.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            text/plain:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /metrics:
    servers:
      - url: http://127.0.0.1:9090
        description: The localhost ops listener (`--ops-addr`).
    get:
      operationId: getMetrics
      tags: [ops]
      summary: Prometheus metrics
      description: Metrics in the Prometheus text exposition format.
      security: []
      responses:
        '200':
          description: The metrics.
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
      description: |
        The agent token from `registerAgent` (random, stored hashed, 24 h, renewed by heartbeats).
        Lease and task routes also require the lease to belong to the agent.
    runToken:
      type: http
      scheme: bearer
      description: |
        A run-scoped token from the lease (`Lease.runToken`): `rtk_` followed by 43 base64url
        characters (32 random bytes), stored hashed, valid only while its lease is (heartbeats
        extend both; complete, abandon or expiry end both). It authorises only its own task's
        prompt, output schema and context, effects on that task, and its own run's transcript
        upload. The supervisor gives it to the workspace's gateway, never to the workspace.
    enrollmentToken:
      type: apiKey
      in: header
      name: X-Factory-Enrollment-Token
      description: |
        A one-time enrollment token from `createEnrollment` (`enr_` and 43 base64url characters,
        32 random bytes; stored hashed). It registers exactly one agent, then it's spent. It
        expires at the enrollment's `expiresAt`.
    agentRefreshToken:
      type: apiKey
      in: header
      name: X-Factory-Agent-Refresh-Token
      description: |
        The agent's long-lived refresh token (`arf_` and 43 base64url characters, 32 random bytes;
        stored hashed), one per agent, from `AgentRegistration.refreshToken`. Each successful
        `registerAgent` with it rotates it: the response carries the new one and the old one is
        spent. Revoked when an admin deletes the agent (`deregisterAgent`).
    uiSession:
      type: apiKey
      in: cookie
      name: factory_session
      description: |
        The web UI's server-side session (GitHub OAuth web flow; `HttpOnly`, `Secure`,
        `SameSite=Lax`, 12 h). Any org member may read; commands need the `maintainers` Group.
    cliToken:
      type: http
      scheme: bearer
      description: |
        The static CLI admin token (`FACTORY_CLI_TOKEN`), for `factory dispatch`. A full admin:
        accepted wherever a UI session is, except `getMe`.
    providerSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: |
        The provider's HMAC signature of the body, verified by the provider adapter (GitHub:
        `X-Hub-Signature-256`). Documented only; not checked by generated code.

  parameters:
    AgentID:
      name: id
      in: path
      required: true
      description: The agent's name (`agt_<owner>-<host>`).
      schema:
        type: string
        minLength: 1
    EnrollmentID:
      name: id
      in: path
      required: true
      description: The enrollment's id (`enl_…`).
      schema:
        type: string
        minLength: 1
    LeaseID:
      name: id
      in: path
      required: true
      description: The lease id from `leaseTask`.
      schema:
        type: string
        minLength: 1
    TaskID:
      name: id
      in: path
      required: true
      description: The task id (`tsk_…`).
      schema:
        type: string
        minLength: 1
    RunID:
      name: id
      in: path
      required: true
      description: The run's name (`run_…`).
      schema:
        type: string
        minLength: 1
    WorkItemID:
      name: id
      in: path
      required: true
      description: The work item's name (`wi_…`).
      schema:
        type: string
        minLength: 1
    EventID:
      name: id
      in: path
      required: true
      description: The event's id (a provider delivery's, `factory/…` or `inject/…`).
      schema:
        type: string
        minLength: 1
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` of the previous page. Opaque.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: The page size.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    LabelSelectorParam:
      name: labelSelector
      in: query
      required: false
      description: 'A Kubernetes-style label selector on `metadata.labels`: `pack=intake,env!=prod,owner`.'
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed or fails validation (`code` says which rule).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (e.g. `effect-not-allowed`, `not-lease-holder`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such object.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The object changed state (e.g. the lease expired or was cancelled).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The body is over the limit (1 MB; transcripts 20 MB).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: A rate limit was hit. `Retry-After` says when to retry.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: |
        Not ready (e.g. `catalog-not-loaded`), at capacity (e.g. `too-many-subscribers`, the SSE
        subscriber limit), or `store-read-only`: the dispatcher's store has stopped writing,
        because it met an entry written by a newer release than it can read. That instance
        refuses writes, and keeps answering reads, until a release that can read the entry
        replaces it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error:
      description: Any other error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---- errors ------------------------------------------------------------------------------
    Problem:
      type: object
      description: An RFC 9457 problem detail.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI identifying the problem type; `about:blank` when only `code` matters.
          default: about:blank
        title:
          type: string
          description: A short summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code.
        detail:
          type: string
          description: This occurrence's explanation.
        instance:
          type: string
          description: The request id of this occurrence.
        code:
          type: string
          description: 'A stable machine-readable code: `idempotency-key-required`, `effect-not-allowed`, `lease-expired`, `store-read-only`, ….'
        errors:
          type: array
          description: Field-level validation errors.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      description: One invalid field.
      required: [field, message]
      properties:
        field:
          type: string
          description: The field's path, e.g. `capabilities.harnesses[0].name`.
        message:
          type: string
          description: What is wrong with it.

    # ---- catalog (API-only; the kinds themselves are generated below) --------------------------
    CatalogKind:
      type: string
      description: A config kind.
      enum: [Provider, Group, Template, Rule, RuleSet, TaskSpec, Queue, Pool]
    CatalogObject:
      description: One config object, by kind.
      oneOf:
        - $ref: '#/components/schemas/Provider'
        - $ref: '#/components/schemas/Group'
        - $ref: '#/components/schemas/Template'
        - $ref: '#/components/schemas/Rule'
        - $ref: '#/components/schemas/RuleSet'
        - $ref: '#/components/schemas/TaskSpec'
        - $ref: '#/components/schemas/Queue'
        - $ref: '#/components/schemas/Pool'
      discriminator:
        propertyName: kind
        mapping:
          Provider: '#/components/schemas/Provider'
          Group: '#/components/schemas/Group'
          Template: '#/components/schemas/Template'
          Rule: '#/components/schemas/Rule'
          RuleSet: '#/components/schemas/RuleSet'
          TaskSpec: '#/components/schemas/TaskSpec'
          Queue: '#/components/schemas/Queue'
          Pool: '#/components/schemas/Pool'

    # ---- agents and leases (API-only) --------------------------------------------------------
    RegisterAgentRequest:
      type: object
      description: The agent's pool, host and offer. The credentials travel in the security headers.
      required: [pool, host, agentVersion, capabilities]
      properties:
        pool:
          type: string
          minLength: 1
          description: The Pool to join.
        host:
          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9-]*$'
          description: The worker's host name; the agent is named `agt_<owner>-<host>`.
        agentVersion:
          type: string
          minLength: 1
          description: The `factory-agent` version.
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        lending:
          $ref: '#/components/schemas/Lending'
    AgentRegistration:
      type: object
      description: The agent's id and its bearer token.
      required: [agentId, agentToken, expiresAt]
      properties:
        agentId:
          type: string
        agentToken:
          type: string
          description: Keep in memory only; re-register on restart.
        expiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          pattern: '^arf_[A-Za-z0-9_-]{43}$'
          description: |
            The agent's new refresh token (the `agentRefreshToken` scheme). Present only when
            registering with an enrollment token or a refresh token. Keep it 0600 on the agent
            host; it replaces the previous one, which is now spent.
    AgentUpdate:
      type: object
      description: A status report and/or a lending update. At least one field.
      minProperties: 1
      properties:
        phase:
          type: string
          enum: [Ready, Throttled, Draining, Offline]
          x-go-type: v1alpha1.AgentPhase
          x-go-type-import:
            path: github.com/ContainerSolutions/factory/internal/apis/v1alpha1
        until:
          type: string
          format: date-time
          description: Required with `Throttled`.
        lending:
          $ref: '#/components/schemas/Lending'
    Lease:
      type: object
      description: |
        A leased task, its lease and its credential bundle for the agent's gateway: the scoped
        git credential, the read credentials and the run token.
      required: [lease, task, gitCredential]
      properties:
        lease:
          $ref: '#/components/schemas/LeaseInfo'
        task:
          $ref: '#/components/schemas/Task'
        gitCredential:
          $ref: '#/components/schemas/GitCredential'
        readCredentials:
          type: array
          description: |
            One read-only credential (`permissions: {contents: read}`) per private read repo of
            the task (`task.spec.credentials.git.readRepos`), its `repo` being that read repo.
            Absent when the task has no read repos or they are public (`publicReads`): those are
            cloned anonymously.
          items:
            $ref: '#/components/schemas/GitCredential'
        runToken:
          type: string
          pattern: '^rtk_[A-Za-z0-9_-]{43}$'
          description: |
            The run-scoped token for this lease (the `runToken` scheme). Appears only in this
            response; the dispatcher keeps only its hash. Not refreshed by heartbeats: it lives
            exactly as long as the lease.
    LeaseInfo:
      type: object
      description: The lease itself.
      required: [id, agent, task, expiresAt, heartbeatEvery]
      properties:
        id:
          type: string
        agent:
          type: string
        task:
          type: string
        run:
          type: string
          description: The Run created for this attempt.
        expiresAt:
          type: string
          format: date-time
        heartbeatEvery:
          type: string
          description: The heartbeat interval (`pool.lease.heartbeat`), e.g. `30s`.
    GitCredential:
      type: object
      description: |
        A scoped installation token for one repo: the task's repo with the TaskSpec permissions,
        or a private read repo with `contents: read`. Never stored by the dispatcher.
      required: [provider, host, username, token, expiresAt, repo]
      properties:
        provider:
          type: string
        host:
          type: string
          description: The git host, e.g. `github.com`.
        username:
          type: string
          description: The username to present with the token (`x-access-token`).
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        repo:
          type: string
          description: The repo the token is for, `owner/name`.
        readRepos:
          type: array
          description: Further repos a read-only token may read (a token that can write covers `repo` only).
          items:
            type: string
        permissions:
          type: object
          additionalProperties:
            type: string
    HeartbeatRequest:
      type: object
      description: Progress events and usage deltas since the previous heartbeat.
      properties:
        progress:
          type: array
          items:
            $ref: '#/components/schemas/ProgressEvent'
        usage:
          $ref: '#/components/schemas/UsageDelta'
    UsageDelta:
      type: object
      description: Usage since the previous heartbeat. `costUSD` is null for subscription runs.
      properties:
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        costUSD:
          type: number
          nullable: true
          minimum: 0
    HeartbeatResponse:
      type: object
      description: The new expiry, whether to cancel, and maybe refreshed credentials.
      required: [expiresAt, cancel]
      properties:
        expiresAt:
          type: string
          format: date-time
        cancel:
          type: boolean
          description: Cancel the run now (the task is being cancelled).
        refreshedGitCredential:
          $ref: '#/components/schemas/GitCredential'
        refreshedReadCredentials:
          type: array
          description: |
            Sent with `refreshedGitCredential` when the task has read-only credentials: they
            replace the lease's `readCredentials`, one per private read repo.
          items:
            $ref: '#/components/schemas/GitCredential'
    CompleteRequest:
      type: object
      description: The run's Result and its transcript.
      required: [result]
      properties:
        result:
          $ref: '#/components/schemas/Result'
        transcriptRef:
          type: string
          description: From `uploadTranscript`.
    AbandonRequest:
      type: object
      description: Why the task is handed back.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [throttled, agent-error, shutdown]
        until:
          type: string
          format: date-time
          description: With `throttled`, when the harness's limit resets.
        message:
          type: string
    TaskContext:
      type: object
      description: One fetched context item, labelled with its trust.
      required: [index, kind, ref, trust, content]
      properties:
        index:
          type: integer
          minimum: 0
        kind:
          type: string
        provider:
          type: string
        ref:
          type: string
        trust:
          type: string
          description: '`trusted` or `untrusted`.'
        mediaType:
          type: string
          default: text/markdown
        content:
          type: string
          description: The fetched content. Untrusted content is fenced and hidden parts are marked, not stripped.
    JSONSchemaDocument:
      type: object
      additionalProperties: true
      description: A JSON Schema (draft 2020-12) document, served as the catalog holds it.
    TranscriptUpload:
      type: object
      description: Where the transcript was stored.
      required: [transcriptRef, bytes]
      properties:
        transcriptRef:
          type: string
        bytes:
          type: integer
          format: int64
    EnvironmentLogUpload:
      type: object
      description: Where the environment log was stored.
      required: [environmentLogRef, bytes]
      properties:
        environmentLogRef:
          type: string
        bytes:
          type: integer
          format: int64
    EffectRequest:
      type: object
      description: One effect. The dispatcher maps the catalog's inline effect fields to `args`.
      required: [op, idempotencyKey]
      properties:
        op:
          $ref: '#/components/schemas/EffectOp'
        target:
          type: string
          description: The object to act on; defaults to the task's primary object.
        args:
          type: object
          additionalProperties: true
          description: Op-specific arguments (`body`, `labels`, `title`, `ref`, `sha`, …).
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: '`<taskID>/<op>/<seq>`, or a skill-chosen key. A repeated key replays the stored effect.'
    EffectResponse:
      type: object
      description: The stored effect and, for API ops, the URL of what it made.
      required: [effectId]
      properties:
        effectId:
          type: string
        url:
          type: string

    # ---- enrollments (API-only) --------------------------------------------------------------
    EnrollmentRequest:
      type: object
      description: The enrollment to mint. The pool, owner and name are fixed by the admin.
      required: [pool, owner, name]
      properties:
        pool:
          type: string
          minLength: 1
          description: The Pool the agent joins.
        owner:
          type: string
          pattern: '^[A-Za-z0-9-]{1,39}$'
          description: The GitHub login of the owner who lends the agent (its lending rules apply).
        name:
          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9-]*$'
          description: The agent host's name, its `RegisterAgentRequest.host`; the agent is named `agt_<owner>-<name>`.
        ttl:
          type: string
          x-go-type: v1alpha1.Duration
          x-go-type-import:
            path: github.com/ContainerSolutions/factory/internal/apis/v1alpha1
          default: 7d
          description: How long the enrollment token may be used, a Duration (`7d`, `36h`). At most `30d`.
    EnrollmentCreated:
      type: object
      description: The minted enrollment and its one-time token.
      required: [enrollment, token]
      properties:
        enrollment:
          $ref: '#/components/schemas/Enrollment'
        token:
          type: string
          pattern: '^enr_[A-Za-z0-9_-]{43}$'
          description: |
            The enrollment token (the `enrollmentToken` scheme), returned only here; the
            dispatcher keeps its hash. Hand it to the agent host's supervisor out of band.
    Enrollment:
      type: object
      description: An enrollment, without its token or the token's hash.
      required: [id, pool, owner, name, createdAt, expiresAt, createdBy, usedAt, agent]
      properties:
        id:
          type: string
          pattern: '^enl_[a-z0-9]{26}$'
          description: The enrollment's id, `enl_` and a lowercase ULID.
        pool:
          type: string
          description: The Pool the agent joins.
        owner:
          type: string
          description: The GitHub login of the agent's owner.
        name:
          type: string
          description: The agent host's name.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: After this the token no longer registers an agent.
        createdBy:
          type: string
          description: The admin who minted it, as an actor id (`<provider>:<login>`, or `factory:cli` for the CLI token).
        usedAt:
          type: string
          format: date-time
          nullable: true
          description: When the token registered the agent; null while unused.
        agent:
          type: string
          nullable: true
          description: The agent the token registered (`agt_<owner>-<name>`); null while unused.
    EnrollmentList:
      type: object
      description: A page of enrollments.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Enrollment'
        nextCursor:
          type: string
          description: Absent on the last page.

    # ---- read models (API-only) --------------------------------------------------------------
    WorkItemList:
      type: object
      description: A page of work items.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkItem'
        nextCursor:
          type: string
          description: Absent on the last page.
    WorkItemDetail:
      type: object
      description: A work item and its timeline.
      required: [workItem, events, tasks, runs, effects]
      properties:
        workItem:
          $ref: '#/components/schemas/WorkItem'
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        effects:
          type: array
          items:
            $ref: '#/components/schemas/Effect'
    TaskList:
      type: object
      description: A page of tasks.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        nextCursor:
          type: string
          description: Absent on the last page.
    RunDetail:
      type: object
      description: A run and its effects.
      required: [run, effects]
      properties:
        run:
          $ref: '#/components/schemas/Run'
        effects:
          type: array
          items:
            $ref: '#/components/schemas/Effect'
    AgentList:
      type: object
      description: A page of agents.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        nextCursor:
          type: string
          description: Absent on the last page.
    QueueList:
      type: object
      description: A page of queues.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueView'
        nextCursor:
          type: string
          description: Absent on the last page.
    QueueView:
      type: object
      description: A queue and its depth.
      required: [queue, depth, running, pending]
      properties:
        queue:
          $ref: '#/components/schemas/Queue'
        depth:
          type: integer
          minimum: 0
          description: Pending tasks.
        running:
          type: integer
          minimum: 0
          description: Leased or running tasks.
        pending:
          type: array
          description: The pending tasks and why each waits.
          items:
            $ref: '#/components/schemas/PendingTask'
    PendingTask:
      type: object
      description: A pending task and the first matching check it failed.
      required: [task]
      properties:
        task:
          type: string
        reason:
          type: string
          description: '`queue-full`, `budget`, `agent-busy`, `agent-throttled`, `lending`, `no-capable-agent`, `anti-affinity`.'
        since:
          type: string
          format: date-time
    PoolList:
      type: object
      description: A page of pools.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PoolView'
        nextCursor:
          type: string
          description: Absent on the last page.
    PoolView:
      type: object
      description: A pool and its agents.
      required: [pool, agents]
      properties:
        pool:
          $ref: '#/components/schemas/Pool'
        agents:
          type: array
          description: The names of the agents registered in the pool.
          items:
            type: string
    ProviderList:
      type: object
      description: A page of providers.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderView'
        nextCursor:
          type: string
          description: Absent on the last page.
    ProviderView:
      type: object
      description: A provider and its health.
      required: [provider, health]
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
        health:
          $ref: '#/components/schemas/ProviderHealth'
    ProviderHealth:
      type: object
      description: A provider connection's health (`Conn.Health()`).
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down, unknown]
        message:
          type: string
        checkedAt:
          type: string
          format: date-time
    CatalogSummary:
      type: object
      description: The loaded catalog.
      required: [ref, sha, status, objects]
      properties:
        repo:
          type: string
          description: The catalog repo URL, or empty for `--catalog-dir`.
        ref:
          type: string
        sha:
          type: string
        loadedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [loaded, loading, error]
          description: '`error` keeps serving the last good catalog.'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CatalogError'
        warnings:
          type: array
          description: |
            The live catalog's warnings, and the missing App installations (code
            `app-not-installed`): an identity's App that isn't installed on a repo a TaskSpec or
            RuleSet can touch.
          items:
            $ref: '#/components/schemas/CatalogError'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/CatalogObjectRef'
    CatalogError:
      type: object
      description: One catalog load error.
      required: [message]
      properties:
        code:
          type: string
        file:
          type: string
        line:
          type: integer
        message:
          type: string
    CatalogObjectRef:
      type: object
      description: One object in the catalog.
      required: [kind, name]
      properties:
        kind:
          $ref: '#/components/schemas/CatalogKind'
        name:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string

    CatalogFileKind:
      type: string
      description: '`prompt` is a template under `prompts/`; `schema` a JSON Schema under `schemas/`.'
      enum: [prompt, schema]
    CatalogFileRef:
      type: object
      description: One prompt or schema file of the catalog.
      required: [path, kind]
      properties:
        path:
          type: string
          description: The catalog-relative path, as TaskSpecs reference it.
        kind:
          $ref: '#/components/schemas/CatalogFileKind'
    CatalogFileList:
      type: object
      description: The catalog's prompt and schema files.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFileRef'
    CatalogFile:
      type: object
      description: One prompt or schema file, as the catalog holds it.
      required: [path, kind, digest, content]
      properties:
        path:
          type: string
        kind:
          $ref: '#/components/schemas/CatalogFileKind'
        digest:
          type: string
          description: '`sha256:<hex>` of the content (a prompt''s is its `spec.prompt.digest`).'
        content:
