    # ---- dry-run (API-only) ------------------------------------------------------------------
    DryRunRequest:
      type: object
      description: An event to evaluate, optionally against an existing work item.
      required: [event]
      properties:
        event:
          $ref: '#/components/schemas/Event'
        workItem:
          type: string
          description: Evaluate against this work item's state; an empty one when absent.
    Evaluation:
      type: object
      description: What the rule engine decided for an event (internal/rules Evaluation).
      required: [event, matches, decisions]
      properties:
        event:
          type: string
        workItem:
          type: string
        matches:
          type: array
          description: Every candidate rule and its result.
          items:
            $ref: '#/components/schemas/RuleMatch'
        decisions:
          type: array
          description: The ordered actions that would be applied.
          items:
            $ref: '#/components/schemas/EvaluationDecision'
        stateAfter:
          type: object
          additionalProperties: true
          description: The projected work item state after all `set` actions.
    RuleMatch:
      type: object
      description: One candidate rule's result.
      required: [ruleSet, rule, result]
      properties:
        ruleSet:
          type: string
        rule:
          type: string
        result:
          type: string
          enum: [matched, not-matched, error, action-error, suppressed-by-final, duplicate]
        actionIndex:
          type: integer
          description: With `action-error`, the failing action.
        error:
          type: string
    EvaluationDecision:
      type: object
      description: One action a rule would take, with its rail verdict and the inputs `where` saw.
      required: [ruleSet, rule, action, rail]
      properties:
        ruleSet:
          type: string
        rule:
          type: string
        action:
          $ref: '#/components/schemas/ActionIntent'
        rail:
          $ref: '#/components/schemas/RailVerdict'
        inputs:
          type: object
          additionalProperties: true
    ActionIntent:
      type: object
      description: A materialised action; the fields besides `type` depend on it.
      required: [type]
      additionalProperties: true
      properties:
        type:
          type: string
          enum: [dispatch, set, notify, cancel, link, effect, debounce, unsupported]
    RailVerdict:
      type: object
      description: A safety rail's verdict on an action.
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [Allowed, Suppressed, Deferred]
        reason:
          type: string

    # ---- commands (API-only) -----------------------------------------------------------------
    Command:
      type: object
      description: An operator command (api-server.md §Commands).
      required: [type]
      properties:
        type:
          type: string
          enum: [pause, resume, cancel, redispatch, dispatch, resync-catalog]
        target:
          $ref: '#/components/schemas/CommandTarget'
        args:
          $ref: '#/components/schemas/CommandArgs'
    CommandTarget:
      type: object
      description: '`{scope, name}` for pause/resume; `{task}` for cancel/redispatch.'
      properties:
        scope:
          type: string
          enum: [global, provider, queue, workitem]
        name:
          type: string
        task:
          type: string
    CommandArgs:
      type: object
      description: '`{harness}` for redispatch; `{event}` for dispatch.'
      properties:
        harness:
          $ref: '#/components/schemas/HarnessRequest'
        event:
          $ref: '#/components/schemas/Event'
    CommandAccepted:
      type: object
      description: The accepted command and the event it became, if any.
      required: [type]
      properties:
        type:
          type: string
        event:
          type: string
          description: The id of the `factory.command.*` or injected event.

    # ---- events (API-only) -------------------------------------------------------------------
    StreamProgress:
      type: object
      description: The data of a `progress` event.
      required: [run, event]
      properties:
        run:
          type: string
        task:
          type: string
        event:
          $ref: '#/components/schemas/ProgressEvent'

    # ---- auth (API-only) ---------------------------------------------------------------------
    Me:
      type: object
      description: The signed-in user.
      required: [login, isAdmin]
      properties:
        login:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
        isAdmin:
          type: boolean
          description: Member of the `maintainers` Group; may send commands.
    DeviceConfig:
      type: object
      description: The OAuth client the agent's device flow uses.
      required: [clientId, scopes]
      properties:
        clientId:
          type: string
        scopes:
          type: array
          items:
            type: string
