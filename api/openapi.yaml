    # ---- agents and leases (API-only) --------------------------------------------------------
    RegisterAgentRequest:
      type: object
      description: The agent's pool, host and offer. The credentials travel in the security headers.
      required: [pool, host, agentVersion, capabilities]
      properties:
        pool:
          type: string
          minLength: 1
          description: The Pool to join.
        host:
          type: string
          minLength: 1
          pattern: '^[a-z0-9][a-z0-9-]*$'
          description: The worker's host name; the agent is named `agt_<owner>-<host>`.
        agentVersion:
          type: string
          minLength: 1
          description: The `factory-agent` version.
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        lending:
          $ref: '#/components/schemas/Lending'
    AgentRegistration:
      type: object
      description: The agent's id and its bearer token.
      required: [agentId, agentToken, expiresAt]
      properties:
        agentId:
          type: string
        agentToken:
          type: string
          description: Keep in memory only; re-register on restart.
        expiresAt:
          type: string
          format: date-time
    AgentUpdate:
      type: object
      description: A status report and/or a lending update. At least one field.
      minProperties: 1
      properties:
        phase:
          type: string
          enum: [Ready, Throttled, Draining, Offline]
          x-go-type: v1alpha1.AgentPhase
          x-go-type-import:
            path: github.com/compliance-framework/factory/internal/apis/v1alpha1
        until:
          type: string
          format: date-time
          description: Required with `Throttled`.
        lending:
          $ref: '#/components/schemas/Lending'
    Lease:
      type: object
      description: A leased task, its lease and a scoped git credential.
      required: [lease, task, gitCredential]
      properties:
        lease:
          $ref: '#/components/schemas/LeaseInfo'
        task:
          $ref: '#/components/schemas/Task'
        gitCredential:
          $ref: '#/components/schemas/GitCredential'
    LeaseInfo:
      type: object
      description: The lease itself.
      required: [id, agent, task, expiresAt, heartbeatEvery]
      properties:
        id:
          type: string
        agent:
          type: string
        task:
          type: string
        run:
          type: string
          description: The Run created for this attempt.
        expiresAt:
          type: string
          format: date-time
        heartbeatEvery:
          type: string
          description: The heartbeat interval (`pool.lease.heartbeat`), e.g. `30s`.
    GitCredential:
      type: object
      description: A scoped installation token for the task's repo. Never stored by the dispatcher.
      required: [provider, host, username, token, expiresAt, repo]
      properties:
        provider:
          type: string
        host:
          type: string
          description: The git host, e.g. `github.com`.
        username:
          type: string
          description: The username to present with the token (`x-access-token`).
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        repo:
          type: string
          description: The read-write (or read-only) task repo, `owner/name`.
        readRepos:
          type: array
          description: Further repos the token may read.
          items:
            type: string
        permissions:
          type: object
          additionalProperties:
            type: string
    HeartbeatRequest:
      type: object
      description: Progress events and usage deltas since the previous heartbeat.
      properties:
        progress:
          type: array
          items:
            $ref: '#/components/schemas/ProgressEvent'
        usage:
          $ref: '#/components/schemas/UsageDelta'
    UsageDelta:
      type: object
      description: Usage since the previous heartbeat. `costUSD` is null for subscription runs.
      properties:
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        costUSD:
          type: number
          nullable: true
          minimum: 0
    HeartbeatResponse:
      type: object
      description: The new expiry, whether to cancel, and maybe a refreshed credential.
      required: [expiresAt, cancel]
      properties:
        expiresAt:
          type: string
          format: date-time
        cancel:
          type: boolean
          description: Cancel the run now (the task is being cancelled).
        refreshedGitCredential:
          $ref: '#/components/schemas/GitCredential'
    CompleteRequest:
      type: object
      description: The run's Result and its transcript.
      required: [result]
      properties:
        result:
          $ref: '#/components/schemas/Result'
        transcriptRef:
          type: string
          description: From `uploadTranscript`.
    AbandonRequest:
      type: object
      description: Why the task is handed back.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [throttled, agent-error, shutdown]
        until:
          type: string
          format: date-time
          description: With `throttled`, when the harness's limit resets.
        message:
          type: string
    TaskContext:
      type: object
      description: One fetched context item, labelled with its trust.
      required: [index, kind, ref, trust, content]
      properties:
        index:
          type: integer
          minimum: 0
        kind:
          type: string
        provider:
          type: string
        ref:
          type: string
        trust:
          type: string
          description: '`trusted` or `untrusted`.'
        mediaType:
          type: string
          default: text/markdown
        content:
          type: string
          description: The fetched content. Untrusted content is fenced and hidden parts are marked, not stripped.
    TranscriptUpload:
      type: object
      description: Where the transcript was stored.
      required: [transcriptRef, bytes]
      properties:
        transcriptRef:
          type: string
        bytes:
          type: integer
          format: int64
    EffectRequest:
      type: object
      description: One effect. The dispatcher maps the catalog's inline effect fields to `args`.
      required: [op, idempotencyKey]
      properties:
        op:
          $ref: '#/components/schemas/EffectOp'
        target:
          type: string
          description: The object to act on; defaults to the task's primary object.
        args:
          type: object
          additionalProperties: true
          description: Op-specific arguments (`body`, `labels`, `title`, `ref`, `sha`, …).
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: '`<taskID>/<op>/<seq>`, or a skill-chosen key. A repeated key replays the stored effect.'
    EffectResponse:
      type: object
      description: The stored effect and, for API ops, the URL of what it made.
      required: [effectId]
      properties:
        effectId:
          type: string
        url:
          type: string

