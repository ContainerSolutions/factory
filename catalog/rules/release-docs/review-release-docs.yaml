# Review the factory's docs PR for a train. The work item's primary link is the train issue in
# workflows, so the dispatch targets the docs PR itself: docsRepo, and the PR the event is
# about (only one in docsRepo).
kind: Rule
metadata: { name: review-release-docs, labels: { pack: release-docs } }
spec:
  providerSelector: { matchLabels: { family: github } }
  on: [pr.opened, pr.updated]
  params: { docsRepo: compliance-framework/docs }          # the dev RuleSet's defaults set mock-docs
  where: "actor.isFactory && has(item.state.release) && event.repo == params.docsRepo"
  actions:
    - cancel: { taskSpec: docs-review }
    - dispatch:
        taskSpec: docs-review
        queue: poc
        target: { repo: "{{ params.docsRepo }}", ref: "=event.object.ref" }
        requires: { labels: [has-local-stack] }
        inputs:
          target: pr
          verifyAgainst: "={'train': item.state.train}"
          checks: [version-accuracy, versioning, style, build]
    - set: { review: running }
