# UC1 trigger (10 §Rules, use case 1): a finished release train in workflows dispatches one
# release-docs task. The work item's primary link is the train issue in workflows, so the
# dispatch names the docs repo as its target: release-docs' rw workspace repo, and so its
# write token, come from task.target.repo. docsRepo is compliance-framework/docs here and
# compliance-framework/mock-docs in the dev RuleSet (its defaults).
#
# versions: the train's releases, repo name → its root package's version ('.' in the
# release-please manifest; repos that released nothing have none), which release-docs'
# environment runs as FACTORY_VERSION_<REPO> (api, ui and agent pin local-dev's images).
kind: Rule
metadata: { name: docs-on-release-train, labels: { pack: release-docs } }
spec:
  providerSelector: { matchLabels: { family: github } }
  on: [issue.closed]
  params: { trainManifest: repos.yaml, allowDryRun: false, docsRepo: compliance-framework/docs }   # dev RuleSet overrides these
  where: >
    event.repo == 'compliance-framework/workflows' && has(event.train) &&
    event.train.manifest == params.trainManifest &&
    (('train:done' in event.issue.labels && !event.train.dryRun) ||
     (params.allowDryRun && 'train:dry-run' in event.issue.labels))
  actions:
    - dispatch:
        taskSpec: release-docs
        queue: poc
        target: { repo: "{{ params.docsRepo }}" }
        inputs:
          train: "=event.object.ref"
          versions: "=event.train.repos.transformMapEntry(i, r, r.versions[?'.'].hasValue(), {r.name: r.versions['.']})"
    - set:
        release: drafting
        train: "=event.object.ref"
        manifest: "=event.train.manifest"   # binds the item to this RuleSet's trains
        versions: "=event.train.repos.transformMapEntry(i, r, r.versions[?'.'].hasValue(), {r.name: r.versions['.']})"   # for review-release-docs' docs-review-verify
