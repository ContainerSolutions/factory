# The epic is one PR (plan-epic's outcome single): implement the epic itself on main, as a
# one-PR stack, so review-whole-stack reviews it when it opens (stackNext + 1 == stackTotal).
# The epic is also a context item, for the ticket file lisa reads in headless mode.
kind: Rule
metadata: { name: build-single, labels: { pack: docs-epic } }
spec:
  on: [factory.run.completed]
  where: "run.spec == 'plan-epic' && run.outcome == 'single'"
  actions:
    - set:
        plan: "=[{'issue': item.links.filter(l, l.primary == true)[0].ref, 'title': 'the epic as one PR', 'dependsOn': []}]"
        stackNext: 0
        stackTotal: 1
    - dispatch:
        taskSpec: implement
        queue: poc
        context: ["=item.links.filter(l, l.primary == true)[0].ref"]
        inputs: { mode: new, target: pr, issue: "=item.links.filter(l, l.primary == true)[0].ref", base: main }
