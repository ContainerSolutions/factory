# UC2 decompose: an epic issue becomes ordered sub-issues (10 §TaskSpecs, catalog-poc LLD).
# Skills: plan-epic (ccf-factory plugin, SKL-S2-T04) and docs-style (ccf-docs).
#
# Labels: the prompt lets the agent label the sub-issues it creates (create-issue labels and
# label.add) with the docs repo's existing `documentation` label and nothing else, so
# effects.labels names exactly that. The control labels (factory:stop, factory:hold,
# do-not-merge) are for people, and needs-human is added by the escalate-needs-human rule,
# not by an agent.
kind: TaskSpec
metadata: { name: plan-epic }
spec:
  description: Decompose a large docs request into ordered, independently reviewable sub-issues.
  instructions: { template: prompts/plan-epic.md.tmpl, headless: true }
  skills: [{ source: ccf-skills, ref: v0.8.0, use: [plan-epic, docs-style] }]
  harness: { default: { name: codex, config: { model: "gpt-5*", reasoningEffort: high } } }
  workspace: { repos: [{ ref: compliance-framework/docs@main, mode: ro }] }
  identity: author
  permissions: { issues: write, contents: read }
  effects: { allow: [create-issue, sub-issue.add, comment, label.add], labels: [documentation] }
  limits: { maxWallClock: 20m }
  output:
    schema: schemas/results/plan-epic.json        # data: plan[]{issue, title, dependsOn[]} (rules read run.result.plan)
    outcomes: [decomposed, single, needs-info]
