# UC1 author: one docs PR for a finished release train (10 §TaskSpecs, catalog-poc LLD).
# Skills: docs-release and docs-style (ccf-docs plugin), docs-gif (ccf-docs), ccf-test and
# sidebyside (skills/, helpers that write no Result), all at the ccf-skills release tag.
#
# Labels: docs-release opens its PR without labels; the prompt lets the agent label the docs
# PR with the docs repo's existing `documentation` label and nothing else, so effects.labels
# names exactly that (the Effector refuses every other label, since #43).
#
# Hosts: the docs site builds with yarn (Node 20), so the sandbox may reach the yarn and npm
# registries. Widening workspace.hosts needs two approvals (FACTORY-CAT-002).
#
# Read repos: local-dev is private, so the TaskSpec doesn't set workspace.publicReads and the
# scheduler mints local-dev its own read-only token with the author App (ccf-factory), which
# must be installed on compliance-framework/local-dev and compliance-framework/ccf-skills.
# The released repos the skills read at runtime (api, ui, agent, plugins) are public and are
# cloned anonymously at their tags: the git credential helper answers only for the task repo
# and the ro repos, whatever publicReads says.
#
# Environment: the VM workspace brings local-dev's showcase up before the harness starts, at
# the train's versions (inputs.versions); the skills read its URLs from FACTORY_STACK_URL and
# FACTORY_STACK_API. docs-review-verify declares the same environment: keep the two equal.
kind: TaskSpec
metadata: { name: release-docs }
spec:
  description: Document every release in a finished release train, in per-repository versioned docs.
  inputs:                                   # declared inputs; rules pass values via dispatch.inputs
    train:       { type: string, required: true }        # e.g. compliance-framework/workflows#123
    depthPolicy: { type: object, default: { patch: notes, minor: full, major: full } }
    versions:    { type: object }                         # component → version (docs-on-release-train: the train's releases)
  instructions: { template: prompts/release-docs.md.tmpl, headless: true }
  skills:
    - { source: ccf-skills, ref: v0.9.0, use: [docs-release, docs-style, docs-gif, ccf-test, sidebyside] }
  harness:
    allowed: [{ name: codex, models: ["gpt-{5,6}*"], reasoningEffort: "*" }, { name: claude-code, models: ["claude-*-5-*"], reasoningEffort: "*" }]
    default: { name: codex, config: { model: "gpt-{5,6}*", reasoningEffort: high } }
  workspace:
    repos:
      # The docs repo is the task's target, never a literal: the RuleSet's dispatch.target picks
      # compliance-framework/docs (prod) or mock-docs (dev), and the write token follows it.
      - { ref: "=task.target.repo + '@main'", mode: rw }        # the only writable repo
      - { ref: compliance-framework/local-dev@main, mode: ro }  # the environment (private: its own read token)
    hosts: [registry.yarnpkg.com, registry.npmjs.org]           # yarn install for the docs site
    environment:
      # local-dev's showcase, up before the harness starts (P1 §4). The ro repos are under
      # /work/ro/<name>; the scripts run as root in the VM, which has its own Docker.
      versions: { from: inputs, input: versions }
      setup: |
        corepack enable
      up: |
        cd /work/ro/local-dev
        [ -f .env ] || cp .env.example .env       # the Makefile includes .env
        export COMPOSE_COMMAND="docker compose"   # local-dev's default is podman-compose
        # FACTORY_VERSION_API/_UI/_AGENT (the train's api, ui and agent releases) pin local-dev's
        # CCF_API_IMAGE, CCF_UI_IMAGE and CCF_AGENT_VERSION, without the release's v; the
        # components not set keep local-dev's file pins. CCF_IMAGES=file, as latest (local-dev's
        # default, which applies when none is set) would replace the pins.
        if [ -n "${FACTORY_VERSION_API:-}${FACTORY_VERSION_UI:-}${FACTORY_VERSION_AGENT:-}" ]; then
          export CCF_IMAGES=file
          [ -z "${FACTORY_VERSION_API:-}" ] || export CCF_API_IMAGE="ghcr.io/compliance-framework/api:${FACTORY_VERSION_API#v}"
          [ -z "${FACTORY_VERSION_UI:-}" ] || export CCF_UI_IMAGE="ghcr.io/compliance-framework/ui:${FACTORY_VERSION_UI#v}"
          [ -z "${FACTORY_VERSION_AGENT:-}" ] || export CCF_AGENT_VERSION="${FACTORY_VERSION_AGENT#v}"
        fi
        # demo-up-showcase without its build (every demo image, from sibling checkouts) and its
        # GitHub credentials check (P1 Phase 0 report, Q3).
        make todo-agent-env
        ./scripts/do start_showcase
        # create-user races the API's migrations on a fresh stack (the same report): the seeding
        # is idempotent, so a failed first pass is retried once.
        make demo-up-showcase-load || make demo-up-showcase-load
        make showcase-kind register-todo-agent
      exposes: { FACTORY_STACK_URL: "http://localhost:8000", FACTORY_STACK_API: "http://localhost:8080" }
      ready: { http: ["http://localhost:8080/api/health", "http://localhost:8000/"], timeout: 20m }
      down: |
        COMPOSE_COMMAND="docker compose" make -C /work/ro/local-dev compose-down-showcase
  identity: author
  permissions: { contents: write, pull_requests: write, issues: read }
  effects: { allow: [push-branch, pr.open, pr.comment, label.add], labels: [documentation] }
  limits: { maxWallClock: 90m, maxTurns: 200 }
  output:
    schema: schemas/results/release-docs.json   # data: train, branch, pr, repos[], checks
    outcomes: [pr-opened, no-docs-change, blocked]
