# Registered agents (the owners' own machines). The join token is a secret reference only:
# factory serve reads it from FACTORY_SECRET_LOCAL_POOL_JOIN_TOKEN.
kind: Pool
metadata: { name: local }
spec:
  mode: registered
  admission: { tokenRef: { name: local-pool, key: join-token }, owners: maintainers }
  # maxTasksPerAgent is the ceiling on each agent's tasks at once; the agent's own
  # lending.maxConcurrent (the owner's consent) is the other cap, and the scheduler takes the
  # smaller. 3 is the Linux workstation's kata supervise (workspace-kata.md); the Mac's tart
  # supervise registers 1 whatever its config says.
  lease: { ttl: 2m, heartbeat: 30s, maxTasksPerAgent: 3 }
