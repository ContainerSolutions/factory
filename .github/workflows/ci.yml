# CI for the factory repo. Go uses the shared go-service CI from compliance-framework/workflows,
# pinned to a release commit, and its shared golangci-lint config (the repo has none). Renovate
# bumps the third-party deps (Go modules, npm, actions), but the compliance-framework/workflows
# pins (ci-go-service.yml and notify-failure.yml, both at the same release commit) are still moved
# by hand: factory is listed in workflows' repos.yaml with release: false, and ccf-bump only bumps
# release: true repos. That changes when factory gets its release workflow and is switched to
# release: true. The web app (web/) has its own local job.
# The kata job builds the kata driver's workspace image (internal/agent/host/provision/kata
# with base.sh in its image mode) on an amd64 runner, so the script's amd64 form is tested for
# real; the arm64 (tart) form is only bash -n'd, in the Go tests.
# Each runs only when its side of the repo changed. The one status check to require is
# `ci / required`, which reports on every PR, including when a side is skipped.
name: ci

on:
  pull_request:
    # closed: notify marks the PR's needs-human card handled and closes its CI incident.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions: {}

jobs:
  changes:
    name: changes
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.state == 'closed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.diff.outputs.go }}
      web: ${{ steps.diff.outputs.web }}
      web-app: ${{ steps.diff.outputs.web-app }}
      kata: ${{ steps.diff.outputs.kata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch or the pushed range must be in the clone
          persist-credentials: false
      - name: Find what changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE...HEAD"
          fi
          if [ -z "$range" ]; then
            echo "No base to compare with; treating everything as changed."
            go=true; web=true; kata=true
          else
            files="$(git diff --name-only "$range")"
            printf 'Changed files:\n%s\n' "$files"
            go=false; web=false; kata=false
            # Workflow changes run every job, so a CI edit is always exercised.
            if grep -qE '^(cmd/|internal/|api/|schemas/|catalog/|go\.mod$|go\.sum$|Makefile$|\.golangci\.yml$|\.github/workflows/)' <<< "$files"; then go=true; fi
            if grep -qE '^(web/|api/openapi\.yaml$|api/examples/|\.github/workflows/)' <<< "$files"; then web=true; fi
            if grep -qE '^(internal/agent/host/provision/|\.github/workflows/)' <<< "$files"; then kata=true; fi
          fi
          web_app=false
          if [ -f web/package.json ]; then web_app=true; fi
          echo "go=$go web=$web web-app=$web_app kata=$kata"
          {
            echo "go=$go"
            echo "web=$web"
            echo "web-app=$web_app"
            echo "kata=$kata"
          } >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    uses: compliance-framework/workflows/.github/workflows/ci-go-service.yml@e85d35af2af2ddfcd4b92061d2063e665c1831f6 # v1.7.0
    with:
      # gofmt, vet, go mod tidy, go test -race, build and golangci-lint run in the shared
      # workflow; these are the repo's own extra gates (see the Makefile).
      make-targets: check-generated catalog openapi-lint
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  web:
    name: web
    needs: changes
    # Skipped until WEB-S0-T01 adds web/package.json.
    if: ${{ needs.changes.outputs.web == 'true' && needs.changes.outputs.web-app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the Node version
        id: node
        run: |
          if [ -f .nvmrc ]; then
            echo "Using web/.nvmrc."
            echo "file=web/.nvmrc" >> "$GITHUB_OUTPUT"
          else
            echo "No web/.nvmrc; using Node 20."
            echo "version=20" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # One of the two is empty; setup-node prefers node-version when both are set.
          node-version: ${{ steps.node.outputs.version }}
          node-version-file: ${{ steps.node.outputs.file }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: reviewable
        run: npm run reviewable

  kata:
    name: kata image
    needs: changes
    if: ${{ needs.changes.outputs.kata == 'true' }}
    runs-on: ubuntu-latest # amd64, the kata driver's only architecture
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The context factory-agent builds: provision.WriteKataContext's files.
      - name: Write the build context
        run: make kata-context DIR="$RUNNER_TEMP/kata-context"
      - name: docker build
        run: docker build --progress=plain -t factory-agent-base:ci "$RUNNER_TEMP/kata-context"
      # Reads paths only: the harness CLIs are never run. One command -v per tool: with several
      # names, bash's command -v succeeds when any is found. Playwright is in npm's global prefix,
      # not on PATH: docs-gif runs it with npx, as here.
      - name: The tools are in place
        run: |
          docker image ls factory-agent-base:ci
          docker run --rm factory-agent-base:ci bash -lc \
            'for t in kind kubectl gh node go vhs gifski chromium codex codex-code-mode-host claude docker; do command -v "$t" || { echo "missing: $t" >&2; exit 1; }; done && cd /tmp && npx --no -- playwright --version'

  required:
    name: required
    needs: [changes, go, web, kata]
    # Skipped, not failed, on a closed PR, like the jobs above.
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.pull_request.state == 'closed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # A side that didn't change is skipped, which is fine; a failed or cancelled job is not.
      - name: Check the results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          if [ "$(jq -r '.changes.result' <<< "$NEEDS")" != "success" ]; then
            echo "::error::the changes job did not succeed"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          echo "All required jobs succeeded or were skipped."

  notify:
    needs: [go, web, kata]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@e85d35af2af2ddfcd4b92061d2063e665c1831f6 # v1.7.0
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit
