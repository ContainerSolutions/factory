# Pushes the dispatcher image (the root Dockerfile: factory with the web UI) to
# ghcr.io/containersolutions/factory as :<tag> and :latest, for linux/amd64 and linux/arm64, when
# a person publishes a GitHub release (deploy/poc/README.md §Releasing). Nothing here creates a
# release or a tag. It is standalone: it calls no other workflow and no other workflow waits on
# it. `make image` builds the same Dockerfile locally.
name: release-image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write # the push to ghcr.io

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      # The tag becomes the image tag and the binary's version: only a plain vX.Y.Z (with an
      # optional -suffix) is accepted. The image name needs a lowercase owner.
      - name: Check the tag and name the image
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag $TAG is not vX.Y.Z[-suffix]"
            exit 1
          fi
          echo "image=ghcr.io/${OWNER,,}/factory" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          TAG: ${{ github.event.release.tag_name }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.TAG }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.TAG }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Only the image: no provenance or SBOM attestations (the PoC's scope).
          provenance: false
          sbom: false
