# Attaches the factory and factory-agent binaries, deploy/install.sh and SHA256SUMS to a GitHub
# release when a person publishes it (deploy/poc/README.md §Releasing). Nothing here creates a release or a tag: a
# person creates the release, with a vX.Y.Z tag, by hand. It is standalone: it calls no other
# workflow and no other workflow waits on it. `make release-assets` builds the same dist/ locally.
name: release-binaries

on:
  release:
    types: [published]

permissions:
  contents: write # gh release upload

concurrency:
  group: release-binaries-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      # The tag goes into make's command line and the binaries' version: only a plain vX.Y.Z
      # (with an optional -suffix) is accepted.
      - name: Check the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag $TAG is not vX.Y.Z[-suffix]"
            exit 1
          fi
      # No caches: a release build restores nothing another workflow wrote.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      - name: make release-assets
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: make release-assets VERSION="$TAG"
      - name: Upload to the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
